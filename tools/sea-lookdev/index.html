<title>Sea Lookdev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Deliberately single-theme: a dusk-at-sea instrument panel around a WebGL view. */
  :root {
    --ink: #0b1017; --panel: #111823; --line: #233041;
    --text: #cdd6df; --muted: #7d8a98; --brass: #c9a45c;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { background: var(--ink); color: var(--text); font: 13px/1.5 var(--mono); padding-inline: 16px; padding-block: 20px; margin: 0; }
  .wrap { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; max-width: 1120px; margin-inline: auto; }
  header { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  h1 { font: 400 26px/1.1 var(--display); color: var(--brass); margin: 0; letter-spacing: .02em; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); }
  .stage { overflow-x: auto; max-width: 100%; }
  #gl { display: block; border: 1px solid var(--line); background: #05080c; outline: none; }
  #gl:focus-visible { border-color: var(--brass); }
  .hint { color: var(--muted); margin-top: 6px; }
  aside { flex: 1 1 260px; background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 16px; }
  h2 { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-variant-numeric: tabular-nums; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; color: var(--text); }
  dd.arrived { color: var(--brass); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); padding: 5px 9px; cursor: pointer; }
  button:hover { border-color: var(--brass); color: var(--brass); }
  button:focus-visible, input:focus-visible { outline: 1px solid var(--brass); outline-offset: 2px; }
  label { display: flex; align-items: center; gap: 8px; }
  input[type="range"] { flex: 1; accent-color: var(--brass); }
  #error { color: #e08a6f; white-space: pre-wrap; }
  #error:empty { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }</script>

<div class="wrap">
  <header>
    <h1>Sea Lookdev</h1>
    <p>THE SEA realm · Nile Delta → Crete · tuning pass</p>
  </header>

  <div>
    <div class="stage"><canvas id="gl" width="780" height="540" tabindex="0" aria-label="Sea view — click, then steer with arrow keys"></canvas></div>
    <div class="hint">Click the view, then ← → steer · ↑ ↓ trim sail</div>
    <div id="error"></div>
  </div>

  <aside>
    <section>
      <h2>Instruments</h2>
      <dl>
        <dt>Speed</dt><dd id="i-speed">0.0 kn</dd>
        <dt>Sail</dt><dd id="i-sail">50%</dd>
        <dt>Off course</dt><dd id="i-heading">0°</dd>
        <dt>To Crete</dt><dd id="i-dist">2.40 km</dd>
        <dt>Storm</dt><dd id="i-storm">0.10</dd>
        <dt>Voyage time</dt><dd id="i-time">0 s</dd>
        <dt>Frame</dt><dd id="i-frame">– ms</dd>
        <dt>Quality</dt><dd id="i-quality">Full</dd>
      </dl>
    </section>
    <section>
      <h2>Storm</h2>
      <label for="storm"><input id="storm" type="range" min="0" max="1" step="0.01" value="0.1"></label>
      <label for="auto"><input id="auto" type="checkbox" checked> Follow the voyage</label>
    </section>
    <section>
      <h2>Jump along the course</h2>
      <div class="row">
        <button id="j-delta" data-along="0">Delta</button>
        <button id="j-wreck" data-along="500">Wreck</button>
        <button id="j-rock" data-along="1150">Signal rock</button>
        <button id="j-horns" data-along="1750">Bull horns</button>
        <button id="j-bay" data-along="2150">Bay approach</button>
      </div>
    </section>
    <section>
      <h2>Weather</h2>
      <div class="row"><button id="bolt">Strike lightning ahead</button></div>
    </section>
  </aside>
</div>

<script type="module">
  import { createVoyage, stepVoyage, wrapAngle } from './sea/voyage.js';
  import { COURSE_HEADING, CRETE_BAY, courseToWorld } from './sea/constants.js';
  import { createSeaScene } from './sea/scene.js';

  const $ = (id) => document.getElementById(id);
  const canvas = $('gl'), storm = $('storm'), auto = $('auto');
  const keys = {};
  canvas.addEventListener('keydown', e => { keys[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
  canvas.addEventListener('keyup', e => { keys[e.key] = false; });
  canvas.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  const v = createVoyage();
  let sea;
  try {
    sea = createSeaScene(canvas, { windAngle: COURSE_HEADING });
  } catch (err) {
    $('error').textContent = 'The scene failed to start: ' + err.message;
    throw err;
  }

  document.querySelectorAll('[data-along]').forEach(b => b.addEventListener('click', () => {
    const p = courseToWorld(Number(b.dataset.along), 0);
    Object.assign(v, { x: p.x, z: p.z, heading: COURSE_HEADING, arrived: false });
    canvas.focus();
  }));
  $('bolt').addEventListener('click', () => {
    const x = v.x + Math.sin(v.heading) * 900, z = v.z + Math.cos(v.heading) * 900;
    sea.flash({ type: 'lightning', x, z, distance: 900, power: 1 });
    canvas.focus();
  });

  let last = performance.now(), frameAvg = 16.7;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    frameAvg += ((now - last) - frameAvg) * 0.05;
    last = now;
    const input = {
      steer: (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0),
      trim:  (keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0),
    };
    const events = stepVoyage(v, input, dt);
    if (auto.checked) storm.value = v.storm.toFixed(2); else v.storm = Number(storm.value);
    for (const e of events) if (e.type === 'lightning') sea.flash(e);
    sea.render(v, dt);

    $('i-speed').textContent = (v.speed * 1.94384).toFixed(1) + ' kn';
    $('i-sail').textContent = Math.round(v.sail * 100) + '%';
    $('i-heading').textContent = Math.round(wrapAngle(v.heading - COURSE_HEADING) * 180 / Math.PI) + '°';
    const dist = $('i-dist');
    dist.textContent = v.arrived ? 'Moored' : (Math.hypot(CRETE_BAY.x - v.x, CRETE_BAY.z - v.z) / 1000).toFixed(2) + ' km';
    dist.className = v.arrived ? 'arrived' : '';
    $('i-storm').textContent = v.storm.toFixed(2);
    $('i-time').textContent = Math.round(v.t) + ' s';
    $('i-frame').textContent = frameAvg.toFixed(1) + ' ms · ' + Math.round(1000 / frameAvg) + ' fps';
    $('i-quality').textContent = sea.degraded ? 'Reduced (rain off)' : 'Full';
    $('i-quality').className = sea.degraded ? 'arrived' : '';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
